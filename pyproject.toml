[project]
name = "dili-tox-predictor"
version = "0.1.0"
description = "Multi-modal ML pipeline for predicting Drug-Induced Liver Injury (DILI) from chemical structure, in vitro assays, and pharmacokinetics"
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2026.3.3",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "shap>=0.49.1",
    "torch-geometric>=2.8.0",
    "xgboost>=3.2.0",
]
